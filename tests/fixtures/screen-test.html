<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Demo Store</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f7f8fa;color:#14181c;font:13.5px 'Helvetica Neue',Arial,sans-serif}main{width:320px;transform:translateY(-40px)}h1{display:flex;gap:10px;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#5a1e83;margin:0 0 34px}.mark{display:grid;grid-template-columns:repeat(3,8px);gap:3px}.mark i{width:8px;height:8px;background:#5a1e83;border-radius:50%}input:not([type=checkbox]){height:42px;width:100%;padding:0 13px;background:white;border:1px solid #e4e7ea;border-radius:4px;font:inherit;margin-bottom:10px}input::placeholder{color:#a6aeb5}.options{display:flex;align-items:center;justify-content:space-between;padding:4px 0 18px;font-size:12.5px;color:#3d4650}label{display:flex;align-items:center;gap:7px}input[type=checkbox]{accent-color:#5a1e83;width:15px;height:15px;margin:0}button{height:42px;width:100%;border:0;border-radius:4px;background:#5a1e83;color:white;font:inherit;cursor:pointer}button.secondary{margin-top:10px;border:1px solid #e1d6ea;background:white;color:#5a1e83}#result{font-size:12px;color:#b32318;white-space:pre-wrap;margin-top:12px}#result:empty{display:none}
</style></head><body><main><h1><span class="mark"><i></i><i></i><i></i><i></i><i></i><i></i></span>Demo Store</h1><form id="login"><input name="username" aria-label="아이디" placeholder="아이디 입력" value="opi1228"><input name="password" aria-label="비밀번호" type="password" placeholder="비밀번호 입력"><div class="options"><label><input name="remember" type="checkbox" checked>아이디 저장</label><span>아이디/비밀번호 찾기</span></div><button>로그인</button><button class="secondary" type="button" id="signup">회원가입</button></form><div id="result" role="status"></div></main><script>
window.loadConfig=async()=>{const r=await fetch('/platform/config');window.lastConfig={status:r.status,body:await r.json()};return window.lastConfig};
window.loadConfig();document.querySelector('form').onsubmit=async e=>{e.preventDefault();const r=await fetch('/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:document.querySelector('[name=username]').value,password:document.querySelector('[name=password]').value})});document.querySelector('#result').textContent=(await r.json()).message;};document.querySelector('#signup').onclick=()=>{history.pushState({},'', '/signup');window.dispatchEvent(new PopStateEvent('popstate'))};
</script></body></html>
