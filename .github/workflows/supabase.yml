name: Supabase

# supabase/** 변경만 다룬다.
# PR: 빈 Postgres에 마이그레이션을 모두 적용해 SQL 오류를 검사한다(클라우드는 건드리지 않음).
# develop 머지: 팀 클라우드에 마이그레이션 반영(db push)과 Edge Function 배포.
# 필요한 저장소 secret: SUPABASE_ACCESS_TOKEN (Supabase 대시보드 > Account > Access Tokens)
# 함수 secret(CHECKLY_CREATE_PROJECT_CODE 등)은 여기서 다루지 않는다 — docs/02-architecture/supabase-guide.md

on:
  pull_request:
    paths: ['supabase/**']
  push:
    branches: [develop]
    paths: ['supabase/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: aphxwkthjgoyrfnoljjh

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # 빈 DB를 띄우면서 supabase/migrations/*.sql을 순서대로 적용한다. SQL 오류면 여기서 실패한다.
      - run: supabase db start
      - run: supabase db lint --level error --fail-on error

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # 반영이 겹치지 않게 한 번에 하나만 돌린다.
    concurrency:
      group: supabase-deploy
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: supabase migration list --linked
      - run: supabase db push --linked --yes
      - run: supabase functions deploy --use-api --project-ref "$SUPABASE_PROJECT_REF"
