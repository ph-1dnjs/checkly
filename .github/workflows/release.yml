name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # `secrets` isn't a recognized named-value inside step `if:` conditions, so the
      # presence check has to go through an intermediate env var set from a run step.
      - name: Detect optional Apple signing secret
        shell: bash
        run: |
          if [ -n "${{ secrets.CSC_LINK }}" ]; then
            echo "HAS_CSC_LINK=true" >> "$GITHUB_ENV"
          fi

      # electron-builder's own temp-keychain creation (triggered by CSC_LINK) hits a
      # `SecKeychainUnlock` failure on current macOS runner images. Importing the
      # certificate into the keychain ourselves via this action avoids that path —
      # electron-builder then auto-discovers the identity from the default keychain,
      # so CSC_LINK/CSC_KEY_PASSWORD must NOT be exported to its env below.
      - name: Import Apple code-signing certificate
        if: runner.os == 'macOS' && env.HAS_CSC_LINK == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.CSC_LINK }}
          p12-password: ${{ secrets.CSC_KEY_PASSWORD }}

      # GitHub Actions fills an unset secret with an empty string rather than omitting
      # the env var. electron-builder's macOS signer treats CSC_LINK='' as a real path
      # and fails with "not a file", so these are only exported when actually configured.
      - name: Configure optional code signing secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.APPLE_ID }}" ]; then
            echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"
          fi
          if [ -n "${{ secrets.WIN_CSC_LINK }}" ]; then
            echo "WIN_CSC_LINK=${{ secrets.WIN_CSC_LINK }}" >> "$GITHUB_ENV"
            echo "WIN_CSC_KEY_PASSWORD=${{ secrets.WIN_CSC_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Package and publish
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
