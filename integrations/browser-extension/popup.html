<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkly</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="popup.css"></head><body>
<header class="app-header"><div class="identity"><span class="avatar" id="avatar" aria-hidden="true">C</span><strong id="account">Checkly</strong><span id="status-light" class="status-light" role="img" aria-label="모니터링 대기" title="모니터링 대기" hidden></span></div><div id="account-actions" class="header-actions" hidden><button id="start" type="button" class="icon-button primary" aria-label="모니터링 시작" title="모니터링 시작"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 5 11 7-11 7z"/></svg></button><button id="stop" type="button" class="icon-button primary" aria-label="모니터링 중지" title="모니터링 중지"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1"/></svg></button><button id="capture" type="button" class="icon-button" aria-label="현재 화면 캡처" title="현재 화면 캡처"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="4"/></svg></button><div class="tooltip-anchor"><button type="button" class="icon-button muted" aria-label="기록 재생 도움말" aria-describedby="monitor-help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 2-3 4M12 17h.01"/></svg></button><span id="monitor-help" class="tooltip" role="tooltip">체클리 → 브라우저 기록 → 서버에서 재생하세요.</span></div><div class="menu-anchor"><button id="more" type="button" class="icon-button" aria-label="더보기" title="더보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button><div id="account-menu" class="dropdown" hidden><button id="logout" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H4V3h5m7 4 5 5-5 5M8 12h13"/></svg>로그아웃</button></div></div></div></header>
<main><form id="login" class="login-form"><h1>Checkly에 로그인</h1><p class="muted">프로젝트 계정으로 연결하세요.</p><label>프로젝트 코드<input name="project" required autocomplete="off"></label><label>닉네임<input name="nickname" required autocomplete="username"></label><label>비밀번호<input name="password" type="password" required autocomplete="current-password"></label><button class="primary">로그인</button></form>
<section id="controls" hidden>
<section class="consent-section"><div id="consent-box" class="consent-box"><label class="consent"><input id="consent" type="checkbox"><span><strong>화면 기록 수집에 동의합니다</strong><small>선택한 탭의 화면 구조·클릭·이동·오류를 로컬에 보관합니다. 선택한 기록만 팀 서버로 전송하며, 입력값과 화면 텍스트, API 요청·응답 본문을 마스킹 없이 수집합니다. 비밀번호·개인정보 등이 포함될 수 있으며 선택해 전송한 기록은 팀원과 공유됩니다. 쿠키와 인증 헤더는 별도로 수집하지 않습니다.</small></span></label></div></section>
<section id="panel-records" aria-label="화면 기록"><div class="section-heading"><div><h2>화면 기록</h2><p id="counts" class="muted"></p></div><div class="record-actions"><button id="reload" type="button" class="icon-button" aria-label="기록 새로고침" title="기록 새로고침"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 6a8 8 0 0 1 13 3M5 15a8 8 0 0 0 13 3"/></svg></button><button id="send" type="button" class="icon-button" aria-label="선택한 기록 전송" title="선택한 기록 전송"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg></button><button id="delete" type="button" class="icon-button destructive" aria-label="선택한 기록 삭제" title="선택한 기록 삭제"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></svg></button></div></div><div id="capture-progress" class="record-progress" hidden><p id="capture-progress-label" role="status"></p><progress id="capture-progress-bar" max="100" aria-label="로컬 기록 수집 진행"></progress></div><p id="local-save-status" class="note" role="status" aria-live="polite"></p><div id="upload-progress" class="record-progress" hidden><p id="upload-progress-label" role="status"></p><progress aria-label="서버 전송 진행"></progress></div><div id="records" class="records"></div></section></section><p id="message" role="status" aria-live="polite"></p></main><dialog id="preview" class="preview-sheet" aria-labelledby="preview-title"><div class="sheet-handle" aria-hidden="true"></div><div class="section-heading"><h2 id="preview-title">기록 미리보기</h2><button id="preview-close" type="button" class="icon-button" aria-label="미리보기 닫기" title="미리보기 닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div><div class="sheet-content"><div id="preview-stage"><div id="preview-root"></div><button id="preview-play" class="player-toggle" type="button" aria-label="재생"></button></div><p id="preview-error" class="note" role="status"></p><label class="notes-label" for="record-notes">참고사항</label><textarea id="record-notes" maxlength="5000" rows="4" placeholder="재현 방법이나 확인할 내용을 남겨 주세요."></textarea><p id="notes-status" class="note" role="status" aria-live="polite"></p></div><div class="sheet-footer"><div id="sheet-upload-progress" class="record-progress" hidden><p id="sheet-upload-progress-label" role="status"></p><progress aria-label="미리보기 서버 전송 진행"></progress></div><button id="preview-send" type="button" class="primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg><span id="preview-send-label">서버로 전송</span></button><p id="preview-send-status" role="status" aria-live="polite"></p></div></dialog><script src="popup.js"></script></body></html>
